<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ .Site.Title }} | {{ .Title }}</title>
        <script>
            (function () {
                var preference;
                try {
                    preference = localStorage.getItem("theme-preference");
                }
                catch (error) {
                    preference = null;
                }
                var theme = preference === "light" || preference === "dark"
                    ? preference
                    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.dataset.theme = theme;
            }());
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&amp;display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ "/css/style.css" | relURL }}">
        <link rel="stylesheet" href="{{ "/css/custom.css" | relURL }}">
    </head>
    <body>
        <div class="wrapper">
            <header>
                <h1>{{ .Site.Title }}</h1>

                <!-- begin short bio -->
                <p>{{ .Site.Params.shortbio }}</p>
                <!-- end short bio -->

                {{/*
                <p class="contactinfo">
                <img src="{{ "/icons/mail-symbol.svg" | relURL }}" class="octicons">
                mailaddr@domain.edu
                </p>
                */}}

                <hr/>

                {{ partial "sidebar.html" . }}

                <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
                    <span class="theme-toggle-label theme-toggle-dark">Dark</span>
                    <span class="theme-toggle-track" aria-hidden="true">
                        <span class="theme-toggle-thumb"></span>
                    </span>
                    <span class="theme-toggle-label theme-toggle-light">Light</span>
                </button>

                <!-- begin photo -->
                {{ with .Site.Params.logo }}
                <img src="{{ . | relURL }}" alt="Logo" />
                {{ end }}
                <!-- end photo -->

            </header>
