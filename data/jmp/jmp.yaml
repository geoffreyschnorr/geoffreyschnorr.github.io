works:
- title: "The Social Cost of Providing Unemployment Insurance to Marginally At-Fault Job Losers"
pdflink: "/pdf/schnorr_jmp.pdf"
  coauthors: "Jonathan Cohen"
  abstract: >
    Approximately 10% of Unemployment Insurance (UI) claimants in the US are denied benefits after being deemed "at-fault" for their job loss. Determining fault is more complex than identifying voluntary separations. Policymakers define circumstances under which voluntary separators remain eligible. When voluntary separations are detected, caseworkers conduct interviews, apply these rules, and determine eligibility. Using administrative data from California, we show that extending eligibility to "marginally at-fault" claimants---who would have been eligible if quasi-randomly assigned to a different caseworker group---is a relatively efficient way to expand the UI program. Our analysis involves three steps. First, we use a judge leniency design to estimate the causal effect of eligibility on several outcomes which could impact the government's budget: nonemployment duration, earnings, future UI receipt (during subsequent nonemployment spells), and receipt of other social program benefits. Second, we combine these responses to calculate a measure of the total fiscal externality of expanding eligibility. Finally, we use the same data and different research designs to provide comparable fiscal externality estimates for other expansions (increases in benefit levels and durations). We conclude that the efficiency costs of at-fault eligibility expansions are lower compared to those of benefit amount or duration increases. We provide suggestive evidence that this is driven by smaller responses among lower-income claimants who are disproportionately affected by at-fault eligibility criteria.
