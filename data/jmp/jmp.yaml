works:
- title: "No-Fault Job Loss? Less Moral Hazard"
  coauthors: "Jonathan Cohen"
  note: "Draft coming soon"
  abstract: >
    Unemployment insurance (UI) eligibility requires a claimant to have lost their job through no fault of their own. Approximately 10% of claims are deemed ineligible solely based on the job separation reason. Using the systematic variation in separation-based eligibility approval rates across UI claim processing offices and examiners in California from 2002 to 2019, we show that receiving any UI benefits causes approximately 2 additional weeks of nonemployment. By replicating existing research designs for other UI policy margins within the California data, we conclude the efficiency costs of UI benefit expansions through separation-based eligibility criteria are lower compared to those of expansions through monetary eligibility, weekly benefit amount, or potential benefit duration.