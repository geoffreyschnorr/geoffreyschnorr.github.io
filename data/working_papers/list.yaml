- title: "Claim Timing and Unemployment Insurance Benefit Generosity"
  note: "Draft coming soon"
  abstract: >
    Unemployment Insurance replaces a percentage of prior earnings while a claimant is out of work. To implement the program, policymakers must define a base period from which prior earnings are measured. I analyze two implications of this previously unexamined policy choice. First, for claimants with volatile enough earnings, a commonly used base period structure creates ''benefit risk''---a job loss at the wrong time implies lower benefit amounts. Second, since base periods are determined by the claim filing date, claimants can partially avoid the negative effects of this risk by strategically timing their claims. Using several new sources of administrative data from California’s Unemployment Insurance program, I make three contributions. First, I use a simple dynamic model of job search and Unemployment Insurance to show that the private welfare costs of benefit risk are large. The average claimant would trade 5% of their expected Unemployment Insurance benefits to eliminate exposure to benefit risk and this number rises substantially among young and especially low-income claimants. Second, I demonstrate that claim-timing responses can act as an effective solution to this problem. Some claimants strategically delay their claims after a job loss in order to receive higher benefits. Third, I provide suggestive evidence that information frictions are a key barrier to this mitigating behavior.

- title: "Am I my Brother's Barkeeper? Sibling Spillovers in Alcohol Consumption at the Minimum Legal Drinking Age"
  pdflink: "/pdf/sibmlda_draft_10feb2022.pdf"
  coauthors: "Eunju Lee"
  note: "Under review"
  abstract: >
    We use data on sibling pairs near the minimum legal drinking age to provide causal estimates of peer effects in alcohol consumption. Following prior work on other outcomes, we exploit the discontinuous increase in alcohol consumption of the older sibling at the legal drinking age in a regression discontinuity design. Our preferred point estimates imply that the number of binge drinking days reported by the younger sibling decreases by 27% of the mean at the cutoff. While our estimates are somewhat imprecise, we are consistently able to rule out positive estimates from the existing literature. Our research design provides estimates which are interpretable as the causal effect of the peer's alcohol consumption. This is in contrast to most prior work which instead identifies the causal effect of exposure to the peer. We explain how this distinction matters for policy.

- title: "Keep Me in, Coach: Can Coaching Improve Marginal College Students' Outcomes?"
  coauthors: "Serena Canaan, Stefanie Fischer, and Pierre Mouganie"
  note: "Updated draft coming soon"
  abstract: >
    This paper evaluates a light-touch group coaching program intended to enhance college persistence of first-year students who are at risk of dropping out. Participants attend a workshop where coaches help them identify their academic difficulties and work on goal-setting and time management skills. Using a difference-in-discontinuity design, we show that the program raises students' first-year GPA and decreases first-year dropout rates. Effects are concentrated among low-income students, who also experience significant increases in their 6-year graduation rate and earnings at ages 24 to 27. Our findings indicate that targeted group coaching can be an effective way to improve marginal students' college success.
